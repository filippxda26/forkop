name: Build packages

# Run manually from an X.Y.Z tag, or from main with an X.Y.Z version input.
# It builds the packages and drafts a GitHub release with install.sh, release.json and SHA256SUMS.
# When run from main, the draft release creates the version tag at the built commit.
# Publishing the draft by hand makes it the latest release, the one install.sh installs and every
# Forkop's update check offers.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 2.0.1); required when running from main"
        type: string
        default: ""
      install_command:
        description: "Optional custom installation command; leave empty for a normal release"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build the release packages
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5.0.0

      - name: Check the release version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            TAG="$REF_NAME"
          elif [ "$REF_TYPE" = branch ] && [ "$REF_NAME" = main ]; then
            TAG="$INPUT_VERSION"
          else
            echo "::error::Choose main or an existing X.Y.Z tag in Use workflow from"
            exit 1
          fi
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Enter an X.Y.Z version (e.g. 2.0.1) or select an existing X.Y.Z tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install -y build-essential curl fakeroot file gawk git patch perl tar unzip util-linux xz-utils zstd

      - name: Build
        env:
          INSTALL_COMMAND: ${{ inputs.install_command }}
          TAG: ${{ steps.version.outputs.tag }}
        run: ./build.sh "$TAG" "$PWD/release"

      - name: Upload the release files
        uses: actions/upload-artifact@v4.6.2
        with:
          name: release
          path: release/*
          retention-days: 1
          if-no-files-found: error

  release:
    name: Draft the release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the release files
        uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - name: Draft the release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::The release $TAG is published already: its files stay as they are"
              exit 1
            fi
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --notes ""
          fi
          gh release upload "$TAG" --clobber -- release/*
