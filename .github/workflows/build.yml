name: Build packages

# Run by hand (Actions, Build packages, Run workflow) from an X.Y.Z tag: it builds the release's
# packages and drafts its GitHub release with them, install.sh, release.json and SHA256SUMS.
# Publishing the draft by hand makes it the latest release, the one install.sh installs and every
# Forkop's update check offers.
on:
  workflow_dispatch:
    inputs:
      install_command:
        description: "Only for a release the Components tab must not install itself: the command that installs it"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build the release packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.0.0

      - name: Check the tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != tag ] || ! [[ "$REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::A release is built from its X.Y.Z tag: choose the tag in Use workflow from"
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl fakeroot file gawk git libjson-c-dev patch perl pkg-config tar unzip util-linux xz-utils zstd

      - name: Build ucode for backend tests
        shell: bash
        run: |
          git clone --depth 1 --branch v0.0.20250529 https://github.com/jow-/ucode.git /tmp/ucode
          cmake -S /tmp/ucode -B /tmp/ucode/build \
            -DUBUS_SUPPORT=OFF \
            -DUCI_SUPPORT=OFF \
            -DULOOP_SUPPORT=OFF
          cmake --build /tmp/ucode/build --parallel
          sudo cmake --install /tmp/ucode/build
          sudo ldconfig

      - name: Validate backend and run tests
        shell: bash
        run: |
          find forkop/files/usr/lib -name '*.uc' -print0 | xargs -0 -n1 ucode -c -o /dev/null
          find forkop/files/usr/lib -name '*.uc' -print0 | xargs -0 -n1 ucode -S -c -o /dev/null
          tests/run.sh

      - name: Set up Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: fe-app-forkop
        run: yarn install --frozen-lockfile

      - name: Test and build LuCI frontend
        working-directory: fe-app-forkop
        run: |
          yarn test --run
          yarn build

      - name: Verify ECH control is present in the release UI
        shell: bash
        run: |
          grep -q 'dns_https_records_enabled' luci-app-forkop/htdocs/luci-static/resources/view/forkop/main.js

      - name: Build
        env:
          INSTALL_COMMAND: ${{ inputs.install_command }}
          TAG: ${{ github.ref_name }}
        run: ./build.sh "$TAG" "$PWD/release"

      - name: Upload the release files
        uses: actions/upload-artifact@v4.6.2
        with:
          name: release
          path: release/*
          retention-days: 1
          if-no-files-found: error

  release:
    name: Draft the release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the release files
        uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - name: Draft the release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::The release $TAG is published already: its files stay as they are"
              exit 1
            fi
          else
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes ""
          fi
          gh release upload "$TAG" --clobber -- release/*
